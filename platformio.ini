[platformio]
build_dir    = C:/Users/merli/.platformio/build_t_display_s3_exercise
default_envs = lilygo-t-display-s3

; ─────────────────────────────────────────────────────────────────────────────
; LilyGo T-Display S3  (ESP32-S3, 16 MB flash, 8 MB PSRAM)
; ─────────────────────────────────────────────────────────────────────────────
[env:lilygo-t-display-s3]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board     = lilygo-t-display-s3
framework = arduino

; 16 MB flash, no OTA (keeps more room for LVGL assets)
board_upload.flash_size  = 16MB
board_build.partitions   = default_16MB.csv

; ESP32-S3 uses native USB; CDC on boot routes Serial over USB
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include
    ; TFT_eSPI — LilyGo T-Display S3 (Setup206: ST7789 8-bit parallel, 170x320)
    -D USER_SETUP_LOADED
    -D USER_SETUP_ID=206
    -D ST7789_DRIVER
    -D CGRAM_OFFSET
    -D TFT_RGB_ORDER=1
    -D TFT_INVERSION_ON
    -D TFT_PARALLEL_8_BIT
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_DC=7
    -D TFT_RST=5
    -D TFT_WR=8
    -D TFT_RD=9
    -D TFT_D0=39
    -D TFT_D1=40
    -D TFT_D2=41
    -D TFT_D3=42
    -D TFT_D4=45
    -D TFT_D5=46
    -D TFT_D6=47
    -D TFT_D7=48
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=1
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT

upload_port   = COM16
upload_speed  = 921600
monitor_port  = COM16
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    mathertel/OneButton @ ^2.0.3
    knolleary/PubSubClient @ ^2.8
    bodmer/TFT_eSPI @ ^2.5.0

; ─────────────────────────────────────────────────────────────────────────────
; Debug build (same board, adds JTAG)
; ─────────────────────────────────────────────────────────────────────────────
[env:lilygo-t-display-s3-debug]
extends    = env:lilygo-t-display-s3
debug_tool = esp-builtin
build_type = debug
