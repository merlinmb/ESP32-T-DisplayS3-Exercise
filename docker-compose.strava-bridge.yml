services:
  strava-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: strava-bridge:latest
    container_name: strava-bridge
    restart: unless-stopped

    ports:
      - "8082:8082"

    volumes:
      # Mount the statistics-for-strava storage directory read-only.
      # The bridge expects the SQLite file to be at /data/database/strava.db inside the container.
      - /home/merlin/portainer_data/strava/storage:/data:ro

    # Optional: join an existing Docker network if you run other strava containers
    # networks:
    #   - strava_net

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8082/api/exercise-load')"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
